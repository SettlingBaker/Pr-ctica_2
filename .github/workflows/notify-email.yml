name: Notificacion por correo al hacer push

on:
  push:
    branches:
      - main
      - feature_a
      - feature_b

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Obtener nombre de la rama
        id: branch
        run: echo "name=${GITHUB_REF#refs/heads/}" >> "$GITHUB_OUTPUT"

      - name: Enviar correo de notificacion
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Cambios subidos a rama ${{ steps.branch.outputs.name }}"
          to: ${{ secrets.MAIL_TO }}
          from: "GitHub Actions <${{ secrets.MAIL_USERNAME }}>"
          body: |
            Se han detectado nuevos cambios en el repositorio.
            Rama: ${{ steps.branch.outputs.name }}
            Autor: ${{ github.actor }}
            Commit: ${{ github.sha }}